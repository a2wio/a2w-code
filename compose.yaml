services:
  a2w:
    build:
      context: .
      dockerfile: Dockerfile
    image: a2w-codex-terraform:0.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - apps/web/.env.local
    environment:
      A2W_CONTAINER_PROJECT_ROOT: /app
      A2W_HOST_PROJECT_ROOT: ${PWD}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - ./.data:/app/.data
      - ./sandbox:/app/sandbox:ro
      - ${HOME}/.codex:/home/node/.codex
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock
