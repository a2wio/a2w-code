name: Container Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY: registry.k6nis.dev
  IMAGE_NAMESPACE: a2w
  PLATFORM: linux/amd64

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::12}"
          {
            echo "version=v${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "web_image=${REGISTRY}/${IMAGE_NAMESPACE}/codex-terraform"
            echo "sandbox_image=${REGISTRY}/${IMAGE_NAMESPACE}/infra-sandbox"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.A2W_REGISTRY_USERNAME }}
          password: ${{ secrets.A2W_REGISTRY_PASSWORD }}

      - name: Build and push web app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.web_image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.web_image }}:latest
          cache-from: type=gha,scope=a2w-web
          cache-to: type=gha,mode=max,scope=a2w-web

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Containerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.meta.outputs.sandbox_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.sandbox_image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.sandbox_image }}:latest
          cache-from: type=gha,scope=a2w-sandbox
          cache-to: type=gha,mode=max,scope=a2w-sandbox
